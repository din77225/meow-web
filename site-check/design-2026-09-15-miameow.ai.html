<style>

  section.page>h2 .pill{font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;background:#eee9f6;color:var(--mm-purple)}
  section.page>h2 .url{font-weight:500;color:var(--muted);font-size:13px}
  .metrics{display:flex;flex-wrap:wrap;gap:8px;padding:12px 18px;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted)}
  .metrics span{background:#f2eee9;border-radius:8px;padding:4px 9px} .metrics b{color:var(--ink)}

  .dot{width:12px;height:12px;border-radius:50%;margin-top:6px;background:var(--info)} .dot.pass{background:var(--pass)} .dot.warn{background:var(--warn)} .dot.fail{background:var(--fail)}

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const col = v => v==null?"#c9c4bd": v>=85?"var(--pass)": v>=60?"var(--warn)":"var(--fail)";
(function(){
  if(!REPORT){document.getElementById("label").textContent="No report embedded";return;}
  document.title=`design-check · ${REPORT.label}`;
  document.getElementById("label").textContent=REPORT.label;
  document.getElementById("meta").textContent=`Checked ${REPORT.checked_at.replace("T"," ")} · ${REPORT.counts.pages} page(s) · ${REPORT.counts.fail} fail · ${REPORT.counts.warn} warn`;
  document.getElementById("thr").textContent=Object.entries(REPORT.thresholds).map(([k,v])=>`${k} ≤ ${v}`).join(" · ");
  const sc=document.getElementById("scores");
  const mk=(id,label,sub,val,overall,delta)=>{const el=document.createElement("div");el.className="score"+(overall?" overall":"");el.innerHTML=`<div class="ring" style="--v:${val??0};--c:${col(val)}"><b>${val??"–"}</b></div><div><div class="lbl">${esc(label)}</div><div class="sub">${esc(sub)}</div>${delta!=null?`<span class="delta ${delta>=0?"up":"down"}">${delta>=0?"+":""}${delta} since last</span>`:""}</div>`;el.onclick=()=>{const t=document.getElementById(id);if(t)t.scrollIntoView({behavior:"smooth"})};sc.appendChild(el);};
  mk("pages","Overall","average of pages",REPORT.overall,true,REPORT.delta?.overall);
  REPORT.pages.forEach(p=>mk("p-"+p.slug,p.slug,`${p.items.filter(i=>i.status==="fail").length} fail · ${p.items.filter(i=>i.status==="warn").length} warn`,p.score,false,null));
  if(REPORT.drift?.length){const d=document.getElementById("drift");d.hidden=false;d.innerHTML="<strong>Cross-page drift</strong> (values that appear on only one page, a sign the design system is not applied everywhere): "+REPORT.drift.map(x=>`<div>${esc(x.dim)}: ${x.count} lonely, e.g. ${x.lonely.slice(0,5).map(v=>`<code>${esc(v)}</code>`).join(", ")}</div>`).join("");}
  const host=document.getElementById("pages");const order={fail:0,warn:1,pass:2,info:3};
  REPORT.pages.forEach(p=>{
    const s=document.createElement("section");s.className="page";s.id="p-"+p.slug;
    const m=p.metrics||{};
    s.innerHTML=`<h2>${esc(p.slug)} <span class="pill">${p.score??"n/a"}</span><span class="url">${esc(p.url)}${p.title?` · “${esc(p.title)}”`:""}</span></h2>
      ${p.metrics?`<div class="metrics"><span>colours <b>${m.colors}</b></span><span>font sizes <b>${m.fontSizes}</b></span><span>families <b>${m.families}</b></span><span>weights <b>${m.weights}</b></span><span>radii <b>${m.radii}</b></span><span>button styles <b>${m.buttons}</b></span><span>readability grade <b>${p.readability?.grade??"n/a"}</b></span><span>elements scanned <b>${m.elements}</b></span></div>`:""}

      ${p.palette?`<div class="swatches"><span class="lbl">text</span>${p.palette.text.slice(0,16).map(c=>`<span class="sw" title="${esc(c)}" style="background:${esc(c)}"></span>`).join("")}<span class="lbl" style="margin-left:14px">backgrounds</span>${p.palette.background.slice(0,16).map(c=>`<span class="sw" title="${esc(c)}" style="background:${esc(c)}"></span>`).join("")}</div>`:""}`;
    p.items.slice().sort((a,b)=>order[a.status]-order[b.status]).forEach(i=>{
      const r=document.createElement("div");r.className="item "+i.status;r.dataset.s=i.status;
      r.innerHTML=`<div class="dot ${i.status}"></div><div><div class="t">${esc(i.title)}</div>${i.detail?`<div class="d">${esc(i.detail)}</div>`:""}${i.fix?`<div class="fix"><b>Fix:</b> ${esc(i.fix)}</div>`:""}</div><span class="badge ${i.status}">${i.status}</span>`;
      r.querySelector(".t").onclick=()=>r.classList.toggle("open");s.appendChild(r);
    });
    host.appendChild(s);
  });
  document.querySelectorAll(".chip[data-f]").forEach(ch=>ch.onclick=()=>{document.querySelectorAll(".chip[data-f]").forEach(x=>x.classList.remove("on"));ch.classList.add("on");const f=ch.dataset.f;document.querySelectorAll(".item").forEach(r=>r.classList.toggle("hidden",!(f==="all"||r.dataset.s===f)));});
